<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      padding: 24px;
    }

    .header {
      background: #1f4e79;
      color: white;
      padding: 18px 24px;
      font-size: 20px;
      font-weight: bold;
    }

    .id-box {
      background: white;
      border-left: 5px solid #1f4e79;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .actions {
      margin-top: 20px;
    }

    .btn-pagar {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #1f4e79;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-cancelar {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #e5e7eb;
      color: #374151;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .loading {
      display: none;
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #1f4e79;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="header">Processar pagamento</div>

  <div class="container">
    <div class="id-box">
      <strong>ID do gasto:</strong> <?= idGasto ?>
    </div>

    <input type="hidden" id="idGasto" value="<?= idGasto ?>">

    <div class="campo">
      <label>Forma de pagamento</label>
      <select id="formaPagamento">
        <option value="PIX">PIX</option>
        <option value="Transferência">Transferência</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Outro">Outro</option>
      </select>
    </div>

    <div class="campo">
      <label>Responsável financeiro</label>
      <input type="text" id="responsavelFinanceiro" placeholder="Nome de quem realizou o pagamento">
    </div>

    <div class="campo">
      <label>Comprovante financeiro</label>
      <input type="file" id="comprovanteFinanceiro">
    </div>

    <div class="campo">
      <label>Observação</label>
      <textarea id="observacao" placeholder="Informações adicionais sobre o pagamento"></textarea>
    </div>

    <div class="actions">
      <button class="btn-pagar" onclick="pagarGasto()">Pagar gasto</button>
      <button class="btn-cancelar" onclick="google.script.host.close()">Cancelar</button>
    </div>

    <div id="loading" class="loading">Processando pagamento...</div>
  </div>

  <script>
    function pagarGasto() {
      const idGasto = document.getElementById("idGasto").value;
      const formaPagamento = document.getElementById("formaPagamento").value;
      const responsavelFinanceiro = document.getElementById("responsavelFinanceiro").value.trim();
      const arquivo = document.getElementById("comprovanteFinanceiro").files[0];
      const observacao = document.getElementById("observacao").value;
      const loading = document.getElementById("loading");

      if (!responsavelFinanceiro) {
        alert("Informe o responsável financeiro.");
        return;
      }

      if (!arquivo) {
        alert("Selecione o comprovante financeiro.");
        return;
      }

      loading.style.display = "block";

      const reader = new FileReader();

      reader.onload = function (event) {
        const base64 = event.target.result.split(",")[1];

        google.script.run
          .withSuccessHandler((linkComprovante) => {
            google.script.run
              .withSuccessHandler(() => {
                alert("Pagamento processado com sucesso!");
                google.script.host.close();
              })
              .withFailureHandler((error) => {
                loading.style.display = "none";
                alert("Erro ao processar pagamento: " + error.message);
              })
              .processarPagamento(
                idGasto,
                formaPagamento,
                responsavelFinanceiro,
                linkComprovante,
                observacao
              );
          })
          .withFailureHandler((error) => {
            loading.style.display = "none";
            alert("Erro ao enviar comprovante: " + error.message);
          })
          .uploadComprovanteFinanceiro(
            base64,
            arquivo.name,
            arquivo.type
          );
      };

      reader.readAsDataURL(arquivo);
    }
  </script>
</body>
</html>
