<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      padding: 24px;
    }

    .header {
      background: #1f4e79;
      color: white;
      padding: 18px 24px;
      font-size: 20px;
      font-weight: bold;
    }

    .id-box {
      background: white;
      border-left: 5px solid #1f4e79;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .actions {
      margin-top: 20px;
    }

    .btn-pagar,
    .btn-cancelar,
    .btn-cancelar-gasto {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-pagar {
      background: #1f4e79;
      color: white;
    }

    .btn-cancelar {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-cancelar-gasto {
      background: #dc2626;
      color: white;
    }

    .btn-cancelar-gasto:hover {
      background: #b91c1c;
    }

    .loading {
      display: none;
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #1f4e79;
      font-weight: bold;
    }

    .mensagem {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    .sucesso {
      background: #dcfce7;
      color: #166534;
    }

    .erro {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>
  <div class="header">Processar pagamento</div>

  <div class="container">
    <div class="id-box">
      <strong>ID do gasto:</strong>
      <?= idGasto ?>
    </div>

    <input type="hidden" id="idGasto" value="<?= idGasto ?>">

    <div class="campo">
      <label>Forma de pagamento</label>
      <select id="formaPagamento">
        <option value="PIX">PIX</option>
        <option value="Transferência">Transferência</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Outro">Outro</option>
      </select>
    </div>

    <div class="campo">
      <label>Responsável financeiro</label>
      <input type="text" id="responsavelFinanceiro" placeholder="Nome de quem realizou o pagamento">
    </div>

    <div class="campo">
      <label>Comprovante financeiro</label>
      <input type="file" id="comprovanteFinanceiro">
    </div>

    <div class="campo">
      <label>Observação</label>
      <textarea id="observacao" placeholder="Informações adicionais sobre o pagamento"></textarea>
    </div>

    <div class="actions">
      <button class="btn-pagar" onclick="pagarGasto()">Pagar gasto</button>

      <button class="btn-cancelar-gasto" onclick="mostrarCancelamento()">
        Cancelar gasto
      </button>

      <button class="btn-cancelar" onclick="google.script.host.close()">
        Fechar modal
      </button>
    </div>

    <div id="cancelamentoBox" style="display:none; margin-top:15px;">
      <label>Motivo do cancelamento</label>

      <textarea
        id="motivoCancelamento"
        placeholder="Informe o motivo do cancelamento"></textarea>

      <button class="btn-cancelar-gasto" onclick="confirmarCancelamento()">
        Confirmar cancelamento
      </button>
    </div>

    <div id="mensagem" class="mensagem"></div>
    <div id="loading" class="loading">Processando...</div>
  </div>

  <script>
    function mostrarMensagem(texto, tipo) {
      const mensagem = document.getElementById("mensagem");

      mensagem.textContent = texto;
      mensagem.className = `mensagem ${tipo}`;
      mensagem.style.display = "block";
    }

    function mostrarLoading(texto) {
      const loading = document.getElementById("loading");
      loading.textContent = texto;
      loading.style.display = "block";
    }

    function esconderLoading() {
      document.getElementById("loading").style.display = "none";
    }

    function pagarGasto() {
      const idGasto = document.getElementById("idGasto").value;
      const formaPagamento = document.getElementById("formaPagamento").value;
      const responsavelFinanceiro = document.getElementById("responsavelFinanceiro").value.trim();
      const arquivo = document.getElementById("comprovanteFinanceiro").files[0];
      const observacao = document.getElementById("observacao").value;

      if (!responsavelFinanceiro) {
        mostrarMensagem("Informe o responsável financeiro.", "erro");
        return;
      }

      if (!arquivo) {
        mostrarMensagem("Selecione o comprovante financeiro.", "erro");
        return;
      }

      mostrarLoading("Enviando comprovante...");

      const reader = new FileReader();

      reader.onload = function (event) {
        const base64 = event.target.result.split(",")[1];

        google.script.run
          .withSuccessHandler((linkComprovante) => {
            mostrarLoading("Processando pagamento...");

            google.script.run
              .withSuccessHandler(() => {
                esconderLoading();
                mostrarMensagem("Pagamento processado com sucesso!", "sucesso");

                setTimeout(() => {
                  google.script.host.close();
                }, 1500);
              })
              .withFailureHandler((error) => {
                esconderLoading();
                mostrarMensagem("Erro ao processar pagamento: " + error.message, "erro");
              })
              .processarPagamento(
                idGasto,
                formaPagamento,
                responsavelFinanceiro,
                linkComprovante,
                observacao
              );
          })
          .withFailureHandler((error) => {
            esconderLoading();
            mostrarMensagem("Erro ao enviar comprovante: " + error.message, "erro");
          })
          .uploadComprovanteFinanceiro(
            base64,
            arquivo.name,
            arquivo.type
          );
      };

      reader.readAsDataURL(arquivo);
    }

    function mostrarCancelamento() {
      document.getElementById("cancelamentoBox").style.display = "block";
    }

    function confirmarCancelamento() {
      const idGasto = document.getElementById("idGasto").value;
      const motivoCancelamento = document.getElementById("motivoCancelamento").value.trim();

      if (!motivoCancelamento) {
        mostrarMensagem("Informe o motivo do cancelamento.", "erro");
        return;
      }

      mostrarLoading("Cancelando gasto...");

      google.script.run
        .withSuccessHandler(() => {
          esconderLoading();
          mostrarMensagem("Gasto cancelado com sucesso!", "sucesso");

          setTimeout(() => {
            google.script.host.close();
          }, 1500);
        })
        .withFailureHandler((error) => {
          esconderLoading();
          mostrarMensagem("Erro ao cancelar gasto: " + error.message, "erro");
        })
        .cancelarGasto(idGasto, motivoCancelamento);
    }
  </script>
</body>
</html>
